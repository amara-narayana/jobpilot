openapi: 3.0.3
info:
  title: JobPilot REST API
  description: >
    JobPilot high-performance REST API powered by C++20 and the Drogon web framework.
    Provides complete lifecycle management for job hunting, recruiter tracking,
    interview scheduling, document management, and career analytics.
  version: 1.0.0
  contact:
    name: JobPilot Engineering
    url: https://jobpilot.io

servers:
  - url: http://localhost:8080/api/v1
    description: Local C++ Drogon Development Server
  - url: https://jobpilot.local/api/v1
    description: Production Nginx Proxy

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: jobpilot_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT/Opaque Token

  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        is_verified:
          type: boolean
          example: true
        created_at:
          type: string
          example: "2026-11-02 08:30:00"

    Application:
      type: object
      properties:
        id:
          type: integer
          example: 101
        company_id:
          type: integer
          example: 12
        company_name:
          type: string
          example: Anthropic
        job_title:
          type: string
          example: Senior Systems Engineer
        job_description:
          type: string
          example: Low-latency systems and distributed systems development
        job_url:
          type: string
          example: https://jobs.lever.co/anthropic/systems
        location:
          type: string
          example: San Francisco, CA (Hybrid)
        employment_type:
          type: string
          enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP, FREELANCE]
          example: FULL_TIME
        salary_range:
          type: string
          example: $190,000 - $240,000
        currency:
          type: string
          example: USD
        date_discovered:
          type: string
          example: "2026-11-01"
        date_applied:
          type: string
          example: "2026-11-02"
        application_deadline:
          type: string
          example: "2026-11-30"
        status:
          type: string
          enum: [SAVED, APPLIED, ASSESSMENT, INTERVIEW, OFFER, REJECTED, WITHDRAWN]
          example: APPLIED
        notes:
          type: string
          example: Referred by Alice from engineering team
        created_at:
          type: string
          example: "2026-11-02 09:00:00"

    Company:
      type: object
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Anthropic
        website:
          type: string
          example: https://anthropic.com
        industry:
          type: string
          example: Artificial Intelligence
        location:
          type: string
          example: San Francisco, CA
        notes:
          type: string
          example: Tier-1 priority company

    Interview:
      type: object
      properties:
        id:
          type: integer
          example: 5
        application_id:
          type: integer
          example: 101
        company_name:
          type: string
          example: Anthropic
        job_title:
          type: string
          example: Senior Systems Engineer
        interview_type:
          type: string
          enum: [SCREENING, TECHNICAL, SYSTEM_DESIGN, BEHAVIORAL, ONSITE, FINAL]
          example: TECHNICAL
        scheduled_at:
          type: string
          example: "2026-11-10 14:00:00"
        duration_minutes:
          type: integer
          example: 60
        meeting_link:
          type: string
          example: https://meet.google.com/abc-defg-hij
        interviewer_name:
          type: string
          example: Bob Smith (Staff Engineer)
        status:
          type: string
          enum: [SCHEDULED, COMPLETED, CANCELLED, RESCHEDULED]
          example: SCHEDULED

    Reminder:
      type: object
      properties:
        id:
          type: integer
          example: 8
        application_id:
          type: integer
          example: 101
        title:
          type: string
          example: Send thank-you note to Bob
        due_at:
          type: string
          example: "2026-11-11 10:00:00"
        is_completed:
          type: boolean
          example: false

    AnalyticsOverview:
      type: object
      properties:
        total_applications:
          type: integer
          example: 48
        active_applications:
          type: integer
          example: 14
        interviews_scheduled:
          type: integer
          example: 6
        offers_received:
          type: integer
          example: 2
        rejection_rate:
          type: number
          example: 25.0
        response_rate:
          type: number
          example: 41.6
        status_distribution:
          type: object
        weekly_activity:
          type: array
          items:
            type: object

paths:
  /auth/register:
    post:
      summary: Register a new user account
      description: Validates credentials, creates an unverified account, hashes password using Argon2id, and generates a 6-digit OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        201:
          description: Registration initiated; OTP generated.
        400:
          description: Validation error or duplicate email.

  /auth/verify-otp:
    post:
      summary: Verify account using 6-digit OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  example: "482910"
      responses:
        200:
          description: Account verified and session cookie issued.
        400:
          description: Invalid or expired OTP.

  /auth/login:
    post:
      summary: Authenticate user and issue session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        200:
          description: Login successful. Session cookie set.
        401:
          description: Invalid credentials or unverified account.

  /auth/logout:
    post:
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Revoke session and clear cookies
      responses:
        200:
          description: Logged out successfully.

  /auth/me:
    get:
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Get currently authenticated user profile and preferences
      responses:
        200:
          description: Authenticated user object.
        401:
          description: Unauthorized.

  /applications:
    get:
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: List user job applications with search, filtering, and pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        200:
          description: Array of applications with pagination metadata.

    post:
      security:
        - sessionCookie: []
        - bearerAuth: []
      summary: Create a new job application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      responses:
        201:
          description: Application created.

  /applications/{id}:
    get:
      security:
        - sessionCookie: []
      summary: Get application details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detailed application record including history and interviews.
        404:
          description: Application not found or access denied.

    put:
      security:
        - sessionCookie: []
      summary: Update application fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      responses:
        200:
          description: Updated application.

    delete:
      security:
        - sessionCookie: []
      summary: Delete application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Application deleted.

  /applications/{id}/status:
    patch:
      security:
        - sessionCookie: []
      summary: Update application status (Kanban drag-and-drop)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [SAVED, APPLIED, ASSESSMENT, INTERVIEW, OFFER, REJECTED, WITHDRAWN]
                notes:
                  type: string
      responses:
        200:
          description: Status transition recorded and history logged.

  /companies:
    get:
      security:
        - sessionCookie: []
      summary: List companies
      responses:
        200:
          description: List of companies.
    post:
      security:
        - sessionCookie: []
      summary: Add a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        201:
          description: Company created.

  /interviews:
    get:
      security:
        - sessionCookie: []
      summary: List scheduled interviews
      responses:
        200:
          description: List of interviews.
    post:
      security:
        - sessionCookie: []
      summary: Schedule a new interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Interview'
      responses:
        201:
          description: Interview scheduled.

  /documents:
    get:
      security:
        - sessionCookie: []
      summary: List uploaded resumes and cover letters
      responses:
        200:
          description: List of user documents.

  /documents/upload:
    post:
      security:
        - sessionCookie: []
      summary: Upload a resume or cover letter
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                document_type:
                  type: string
                  enum: [RESUME, COVER_LETTER, PORTFOLIO, OTHER]
      responses:
        201:
          description: File saved and document record created.

  /analytics/overview:
    get:
      security:
        - sessionCookie: []
      summary: Retrieve complete career analytics and funnel metrics
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'

  /reminders:
    get:
      security:
        - sessionCookie: []
      summary: List pending and completed reminders
      responses:
        200:
          description: Array of reminders.
    post:
      security:
        - sessionCookie: []
      summary: Create a follow-up reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reminder'
      responses:
        201:
          description: Reminder created.

  /reminders/{id}/complete:
    patch:
      security:
        - sessionCookie: []
      summary: Mark reminder as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Reminder updated.

  /user/export:
    get:
      security:
        - sessionCookie: []
      summary: Export complete user data in JSON format
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        200:
          description: Complete user data backup file.
