# ==============================================================================
# JobPilot - High-Performance Nginx Reverse Proxy Configuration
# ==============================================================================
# Serves static React PWA assets directly with aggressive caching & gzip,
# and proxies API requests (/api/) asynchronously to the C++ Drogon backend.
# ==============================================================================

# Upstream Drogon C++ Application Server
upstream jobpilot_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# HTTP to HTTPS redirect (Production)
server {
    listen 80;
    listen [::]:80;
    server_name jobpilot.local career.yourdomain.com;

    # Allow ACME challenge for Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobpilot.local career.yourdomain.com;

    # SSL Certificates (Configure with your domain cert paths)
    ssl_certificate /etc/ssl/certs/jobpilot.crt;
    ssl_certificate_key /etc/ssl/private/jobpilot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:8080;" always;

    # Document upload limit (resumes and cover letters)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Compression Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype;

    # Static Frontend SPA (React + Vite Build Output)
    root /var/www/jobpilot/frontend/dist;
    index index.html;

    # Static Assets Caching (Vite hashed bundles)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to C++ Drogon Backend
    location /api/ {
        proxy_pass http://jobpilot_backend;
        proxy_http_version 1.1;

        # WebSocket & Keepalive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request identification
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for async operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Uploads Storage (Resumes & Documents)
    location /uploads/ {
        alias /var/www/jobpilot/uploads/;
        internal; # Prevent direct external URL execution without auth validation if needed
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
